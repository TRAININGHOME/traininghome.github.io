<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANTRA | Gestión Inteligente de Sedes</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        :root {
            --primary: #00d2ff; 
            --accent: #7000ff;
            --bg-dark: #0a0a0c;
            --card-bg: #16161a; /* Fondo sólido para formularios */
            --input-bg: #222228; /* Fondo de los campos de texto/select */
            --glass: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            overflow: hidden;
        }

        /* --- PANTALLA DE CARGA --- */
        #loader {
            position: fixed;
            width: 100%; height: 100vh;
            background: #000;
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
            transition: opacity 1s ease, visibility 1s;
        }

        .loader-text {
            font-size: 3.5rem; font-weight: 900; letter-spacing: 15px;
            color: var(--primary);
            animation: glow 2s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(0,210,255,0.5); opacity: 0.6; }
            to { text-shadow: 0 0 30px rgba(0,210,255,1); opacity: 1; }
        }

        /* --- NAVBAR --- */
        nav {
            padding: 20px 50px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(10, 10, 12, 0.8);
            backdrop-filter: blur(15px);
            position: fixed; width: 100%; z-index: 1000; box-sizing: border-box;
        }

        .logo { font-size: 1.8rem; font-weight: 800; color: var(--primary); cursor: pointer; }

        /* --- HERO --- */
        .hero {
            height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at top right, rgba(0, 210, 255, 0.1), transparent),
                        radial-gradient(circle at bottom left, rgba(112, 0, 255, 0.1), transparent);
            text-align: center;
        }

        h1 { font-size: 4rem; margin: 0; font-weight: 900; }
        h1 span { color: var(--primary); }
        p.subtitle { font-size: 1.2rem; color: var(--text-dim); margin: 25px 0 40px; }

        /* --- BOTONES --- */
        .btn-main {
            padding: 16px 35px; border-radius: 12px; font-weight: 700;
            transition: 0.4s; display: flex; align-items: center; gap: 10px;
            cursor: pointer; border: none; font-family: inherit;
        }
        .organizer { background: var(--primary); color: #000; }
        .guest { border: 2px solid var(--primary); color: var(--primary); background: transparent; }
        .btn-main:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(0, 210, 255, 0.3); }

        /* --- MODALES Y FORMULARIOS --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.92);
            display: none; justify-content: center; align-items: center;
            z-index: 2000; backdrop-filter: blur(15px);
        }

        .form-card {
            background: var(--card-bg);
            padding: 40px; border-radius: 24px;
            border: 1px solid rgba(0, 210, 255, 0.2);
            width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: var(--primary); font-weight: 600; }

        /* CORRECCIÓN DE COLOR EN INPUTS Y SELECTS */
        .input-group input, 
        .input-group select {
            width: 100%;
            padding: 14px;
            background-color: var(--input-bg); /* Fondo oscuro para que resalte el texto */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #ffffff; /* Texto siempre blanco */
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
            appearance: none; /* Quita el estilo por defecto del sistema */
        }

        /* Estilo para las opciones dentro del select */
        .input-group select option {
            background-color: var(--card-bg);
            color: white;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }

        .lock-notice {
            background: rgba(255, 77, 77, 0.1);
            color: #ff4d4d; padding: 12px; border-radius: 10px;
            font-size: 0.85rem; margin-bottom: 20px; border: 1px solid rgba(255, 77, 77, 0.3);
        }

        .close-btn { margin-top: 25px; color: var(--text-dim); cursor: pointer; display: block; font-size: 0.9rem; }
        .close-btn:hover { color: white; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="loader-text">MANTRA</div>
    </div>

    <nav>
        <div class="logo">MANTRA</div>
        <button onclick="openLogin()" class="btn-main guest" style="padding: 10px 20px; font-size: 0.8rem;">Iniciar Sesión</button>
    </nav>

    <header class="hero">
        <div class="hero-inner">
            <h1>Gestión de <span>Sedes</span> Premium.</h1>
            <p class="subtitle">Infraestructura digital para los recintos de Hugo Isac.</p>
            <div class="cta-group">
                <button onclick="checkAccess('organizador')" class="btn-main organizer">Soy Organizador</button>
                <button onclick="checkAccess('buscar')" class="btn-main guest">Buscar Eventos</button>
            </div>
        </div>
    </header>

    <div id="modal-login" class="modal-overlay">
        <div class="form-card">
            <h2>Acceso Seguro</h2>
            <div class="input-group">
                <label>Email Corporativo</label>
                <input type="email" id="userEmail" placeholder="nombre@ejemplo.com">
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" placeholder="••••••••">
            </div>
            <button class="btn-main organizer" style="width: 100%;" onclick="processLogin()">Entrar al Sistema</button>
            <span class="close-btn" onclick="closeModals()">Cancelar</span>
        </div>
    </div>

    <div id="modal-organizador" class="modal-overlay">
        <div class="form-card">
            <div class="lock-notice" id="lock-org"><i class="fas fa-lock"></i> Autenticación requerida</div>
            <h2>Reservar Sede</h2>
            <div id="content-org" style="opacity: 0.2; pointer-events: none;">
                <div class="input-group">
                    <label>Nombre del Evento</label>
                    <input type="text">
                </div>
                <div class="input-group">
                    <label>Sede Disponible</label>
                    <select>
                        <option>Seleccionar sede...</option>
                        <option>Sede Roma - CDMX</option>
                        <option>Sede Condesa - CDMX</option>
                        <option>Sede Polanco - CDMX</option>
                    </select>
                </div>
                <button class="btn-main organizer" style="width: 100%;" onclick="window.location.href='organizador-success.html'">Enviar Solicitud</button>
            </div>
            <span class="close-btn" onclick="closeModals()">← Volver</span>
        </div>
    </div>

    <div id="modal-buscar" class="modal-overlay">
        <div class="form-card">
            <div class="lock-notice" id="lock-bus"><i class="fas fa-lock"></i> Autenticación requerida</div>
            <h2>Cartelera Digital</h2>
            <div id="content-bus" style="opacity: 0.2; pointer-events: none;">
                <div class="input-group">
                    <label>¿Qué evento buscas?</label>
                    <input type="text" placeholder="Ej: Concierto Rock">
                </div>
                <button class="btn-main guest" style="width: 100%;" onclick="window.location.href='eventos.html'">Explorar</button>
            </div>
            <span class="close-btn" onclick="closeModals()">← Volver</span>
        </div>
    </div>

    <script>
        let isLoggedIn = false;

        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loader');
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.visibility = 'hidden'; document.body.style.overflow = 'auto'; }, 1000);
            }, 2000);
        });

        function openLogin() { document.getElementById('modal-login').style.display = 'flex'; }

        function processLogin() {
            isLoggedIn = true;
            const email = document.getElementById('userEmail').value;
            alert("Acceso concedido");
            closeModals();
            if(email === 'hugo@mantra.com') window.location.href = 'hugo-dashboard.html';
        }

        function checkAccess(tipo) {
            const modalId = tipo === 'organizador' ? 'modal-organizador' : 'modal-buscar';
            document.getElementById(modalId).style.display = 'flex';
            
            if (isLoggedIn) {
                const lockId = tipo === 'organizador' ? 'lock-org' : 'lock-bus';
                const contentId = tipo === 'organizador' ? 'content-org' : 'content-bus';
                document.getElementById(lockId).style.display = 'none';
                document.getElementById(contentId).style.opacity = '1';
                document.getElementById(contentId).style.pointerEvents = 'auto';
            }
        }

        function closeModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
        }
    </script>
</body>
</html>
